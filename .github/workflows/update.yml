# Weekly input updates — CI opens the PR, the lock diff stays the review
# surface. Same private-input setup as ci.yml (read-only deploy keys).
#
# `nix flake check` gates the PR: an update that breaks evaluation never
# reaches the queue.
name: Update flake inputs

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - uses: DeterminateSystems/nix-installer-action@v17

      - name: Update all inputs
        run: nix flake update

      - name: Evaluate every host
        run: nix flake check . --all-systems --no-build

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-flake-inputs
          delete-branch: true
          title: Update flake inputs
          commit-message: "Update flake.lock"
          body: |
            Automated weekly `nix flake update`.

            Review the `flake.lock` diff — that diff *is* the change. CI has
            already verified that every host still evaluates.
